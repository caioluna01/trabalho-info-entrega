services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - dados_oficina:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ordens').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  dados_oficina:
